{% extends 'base.html' %}
{% block content %}
<div class="card p-4 text-center">
  <h4>Delete this transaction?</h4>
  <p>{{ obj.date }} - ₹{{ obj.amount }} ({{ obj.note }})</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'transaction_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
