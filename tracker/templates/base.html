<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PennyPilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">💰 PennyPilot</a>
        <span style="color:#ffc107;">💸 Penny</span> <span style="color:#20c997;">Pilot</span>
        <div class="navbar-nav ms-auto align-items-center">
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                <a class="nav-link" href="{% url 'transaction_list' %}">Transactions</a>
                <a class="nav-link" href="{% url 'category_list' %}">Categories</a>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-light ms-2">Logout ({{ user.username }})</button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Login</a>
                <a class="nav-link" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
